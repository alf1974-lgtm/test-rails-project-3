<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Two Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="info-section">
            <div class="current-player">
                <span id="playerDisplay">Player 1's Turn (X)</span>
            </div>
            <div class="status">
                <span id="gameStatus"></span>
            </div>
        </div>
        
        <div class="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="resetBtn" class="reset-button">New Game</button>

        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>Player 1 starts with X</li>
                <li>Player 2 plays with O</li>
                <li>Players alternate turns</li>
                <li>After each move, pass the mouse to the other player</li>
                <li>First to get 3 in a row wins!</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
