<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetroggleable - Tetris + Boggle + Scrabble</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .game-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-board {
            border: 3px solid #333;
            background: #1a1a1a;
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(20, 30px);
            gap: 1px;
            padding: 5px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .cell {
            background: #222;
            border: 1px solid #444;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            overflow: hidden;
        }

        .cell.filled {
            background: #4CAF50;
        }

        .cell.bonus-double-word {
            background: #FFB6D9;
        }

        .cell.bonus-triple-word {
            background: #FF69B4;
        }

        .cell.bonus-double-letter {
            background: #ADD8E6;
        }

        .cell.bonus-triple-letter {
            background: #0099FF;
        }

        .cell-letter {
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        .cell.bonus-double-word .cell-letter,
        .cell.bonus-triple-word .cell-letter {
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .cell.bonus-double-letter .cell-letter,
        .cell.bonus-triple-letter .cell-letter {
            color: #000;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }

        .bonus-label {
            position: absolute;
            font-size: 8px;
            color: rgba(0, 0, 0, 0.4);
            top: 1px;
            left: 1px;
            z-index: 1;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 250px;
        }

        .info-panel {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .next-piece {
            background: #222;
            border: 2px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(4, 25px);
            grid-template-rows: repeat(4, 25px);
            gap: 1px;
        }

        .next-piece .cell {
            width: 25px;
            height: 25px;
            font-size: 12px;
        }

        .word-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-input input {
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-input input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        .word-input button {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .word-input button:hover {
            background: #764ba2;
        }

        .word-input button:active {
            transform: scale(0.98);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        .message.success {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .message.error {
            background: #ffcdd2;
            color: #c62828;
        }

        .message.info {
            background: #bbdefb;
            color: #1565c0;
        }

        .controls {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 12px;
            line-height: 1.6;
        }

        .controls h4 {
            margin-bottom: 10px;
            color: #333;
        }

        .controls p {
            margin-bottom: 5px;
            color: #666;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1000;
            display: none;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .game-over p {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }

        .game-over button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        .last-words {
            max-height: 150px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        .last-words .word-item {
            padding: 5px;
            margin: 3px 0;
            background: #e8f5e9;
            border-left: 3px solid #4CAF50;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-section">
            <h1 style="text-align: center; color: #667eea; margin-bottom: 10px;">Tetroggleable</h1>
            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="sidebar">
            <div class="info-panel">
                <h3>Score</h3>
                <div class="score" id="score">0</div>
            </div>

            <div class="info-panel">
                <h3>Next Piece</h3>
                <div class="next-piece" id="nextPiece"></div>
            </div>

            <div class="info-panel">
                <h3>Word Input</h3>
                <div class="word-input">
                    <input type="text" id="wordInput" placeholder="Type a word..." maxlength="20">
                    <button onclick="game.submitWord()">Submit Word</button>
                    <div class="message" id="message"></div>
                </div>
            </div>

            <div class="info-panel">
                <h3>Last Words</h3>
                <div class="last-words" id="lastWords"></div>
            </div>

            <div class="controls">
                <h4>Controls</h4>
                <p><strong>← →</strong> Move</p>
                <p><strong>↑</strong> Rotate</p>
                <p><strong>Space</strong> Drop</p>
                <p><strong>Type</strong> Word</p>
                <p><strong>Enter</strong> Submit</p>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOverModal">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">Play Again</button>
    </div>

                    'WARS', 'WART', 'WARY', 'WASH', 'WASP', 'WAVE', 'WAVY', 'WAXY', 'WEAK',
                    'WEAL', 'WEAR', 'WEARY', 'WEAVE', 'WEBS', 'WEDS', 'WEED', 'WEEK', 'WEEP',
                    'WEIR', 'WELD', 'WELL', 'WELT', 'WENT', 'WEPT', 'WERE', 'WEST', 'WETS',
                    'WHAT', 'WHEN', 'WHET', 'WHEY', 'WHIM', 'WHIP', 'WHIR', 'WHIT', 'WHIZ',
                    'WHOM', 'WICK', 'WIDE', 'WIFE', 'WILD', 'WILE', 'WILL', 'WILT', 'WIND',
                    'WINE', 'WING', 'WINK', 'WIPE', 'WIRE', 'WIRY', 'WISE', 'WISH', 'WISP',
                    'WITH', 'WOKE', 'WOLF', 'WOMB', 'WONT', 'WOOD', 'WOOL', 'WORD', 'WORE',
                    'WORK', 'WORM', 'WORN', 'WRAP', 'WREN', 'WRIT', 'YANK', 'YARD', 'YARN',
                    'YAWN', 'YEAR', 'YELL', 'YELP', 'YOKE', 'YOLK', 'YOUR', 'YOWL', 'YUAN',
                    'YUCK', 'YULE', 'ZEAL', 'ZERO', 'ZEST', 'ZINC', 'ZONE', 'ZOOM'
                ];
                words.forEach(word => this.dictionary.add(word));
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                document.getElementById('wordInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.submitWord();
                    }
                });
            }

            handleKeyPress(e) {
                if (this.gameOver) return;

                switch (e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        this.movePiece(-1, 0);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        this.movePiece(1, 0);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        this.rotatePiece();
                        break;
                    case ' ':
                        e.preventDefault();
                        this.dropPiece();
                        break;
                }
            }

            spawnPiece() {
                if (this.nextPiece === null) {
                    this.nextPiece = this.getRandomPiece();
                }
                this.currentPiece = this.nextPiece;
                this.nextPiece = this.getRandomPiece();
                this.currentX = Math.floor(BOARD_WIDTH / 2) - 1;
                this.currentY = 0;

                // Add letters to the piece
                this.addLettersToPiece(this.currentPiece);

                if (this.collides(this.currentX, this.currentY, this.currentPiece.shape)) {
                    this.endGame();
                }
            }

            getRandomPiece() {
                const piece = JSON.parse(JSON.stringify(PIECES[Math.floor(Math.random() * PIECES.length)]));
                return piece;
            }

            addLettersToPiece(piece) {
                piece.letters = [];
                for (let row of piece.shape) {
                    let letterRow = [];
                    for (let cell of row) {
                        if (cell === 1) {
                            const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                            const bonus = Math.random() < BONUS_CHANCE ? this.getRandomBonus() : null;
                            letterRow.push({ letter, bonus });
                        } else {
                            letterRow.push(null);
                        }
                    }
                    piece.letters.push(letterRow);
                }
            }

            getRandomBonus() {
                const bonuses = ['double-word', 'triple-word', 'double-letter', 'triple-letter'];
                return bonuses[Math.floor(Math.random() * bonuses.length)];
            }

            movePiece(dx, dy) {
                if (!this.collides(this.currentX + dx, this.currentY + dy, this.currentPiece.shape)) {
                    this.currentX += dx;
                    this.currentY += dy;
                    this.render();
                }
            }

            rotatePiece() {
                const rotated = this.rotateCW(this.currentPiece.shape);
                const rotatedLetters = this.rotateCW(this.currentPiece.letters);
                if (!this.collides(this.currentX, this.currentY, rotated)) {
                    this.currentPiece.shape = rotated;
                    this.currentPiece.letters = rotatedLetters;
                    this.render();
                }
            }

            rotateCW(matrix) {
                const n = matrix.length;
                const m = matrix[0].length;
                const rotated = Array(m).fill(null).map(() => Array(n).fill(null));
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < m; j++) {
                        rotated[j][n - 1 - i] = matrix[i][j];
                    }
                }
                return rotated;
            }

            dropPiece() {
                while (!this.collides(this.currentX, this.currentY + 1, this.currentPiece.shape)) {
                    this.currentY++;
                }
                this.lockPiece();
            }

            collides(x, y, shape) {
                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[row].length; col++) {
                        if (shape[row][col] === 1) {
                            const boardX = x + col;
                            const boardY = y + row;
                            if (boardX < 0 || boardX >= BOARD_WIDTH || boardY >= BOARD_HEIGHT) {
                                return true;
                            }
                            if (boardY >= 0 && this.board[boardY][boardX] !== null) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            lockPiece() {
                for (let row = 0; row < this.currentPiece.shape.length; row++) {
                    for (let col = 0; col < this.currentPiece.shape[row].length; col++) {
                        if (this.currentPiece.shape[row][col] === 1) {
                            const boardX = this.currentX + col;
                            const boardY = this.currentY + row;
                            if (boardY >= 0) {
                                this.board[boardY][boardX] = {
                                    letter: this.currentPiece.letters[row][col].letter,
                                    bonus: this.currentPiece.letters[row][col].bonus,
                                    color: this.currentPiece.color
                                };
                            }
                        }
                    }
                }
                this.clearLines();
                this.spawnPiece();
                this.render();
            }

            clearLines() {
                let linesCleared = 0;
                for (let row = BOARD_HEIGHT - 1; row >= 0; row--) {
                    if (this.board[row].every(cell => cell !== null)) {
                        this.board.splice(row, 1);
                        this.board.unshift(Array(BOARD_WIDTH).fill(null));
                        linesCleared++;
                        row++;
                    }
                }
                if (linesCleared > 0) {
                    this.score += linesCleared * 10;
                }
            }

            submitWord() {
                const input = document.getElementById('wordInput');
                const word = input.value.toUpperCase().trim();
                input.value = '';

                if (!word) {
                    this.showMessage('Please enter a word', 'error');
                    return;
                }

                if (!this.dictionary.has(word)) {
                    this.showMessage(`"${word}" is not a valid word`, 'error');
                    return;
                }

                const matches = this.findWordInBoard(word);
                if (matches.length === 0) {
                    this.showMessage(`"${word}" not found on board`, 'error');
                    return;
                }

                // Calculate score
                let wordScore = 0;
                let wordMultiplier = 1;
                let hasDoubleWord = false;
                let hasTripleWord = false;

                for (let pos of matches) {
                    const cell = this.board[pos.row][pos.col];
                    const letterValue = LETTER_VALUES[cell.letter] || 0;
                    let letterScore = letterValue;

                    if (cell.bonus === 'double-letter') {
                        letterScore *= 2;
                    } else if (cell.bonus === 'triple-letter') {
                        letterScore *= 3;
                    } else if (cell.bonus === 'double-word') {
                        hasDoubleWord = true;
                    } else if (cell.bonus === 'triple-word') {
                        hasTripleWord = true;
                    }

                    wordScore += letterScore;
                }

                if (hasTripleWord) {
                    wordMultiplier = 3;
                } else if (hasDoubleWord) {
                    wordMultiplier = 2;
                }

                // Double points for 7+ letter words
                if (word.length >= 7) {
                    wordMultiplier *= 2;
                }

                wordScore *= wordMultiplier;

                // Remove matched blocks
                for (let pos of matches) {
                    this.board[pos.row][pos.col] = null;
                }

                // Apply gravity
                this.applyGravity();

                this.score += wordScore;
                this.wordHistory.unshift({ word, score: wordScore });
                if (this.wordHistory.length > 10) {
                    this.wordHistory.pop();
                }

                this.showMessage(`"${word}" +${wordScore} points!`, 'success');
                this.render();
            }

            findWordInBoard(word) {
                const matches = [];
                const visited = new Set();

                // Try to find the word reading left-to-right and top-to-bottom
                for (let row = 0; row < BOARD_HEIGHT; row++) {
                    for (let col = 0; col < BOARD_WIDTH; col++) {
                        if (this.board[row][col] && this.board[row][col].letter === word[0]) {
                            // Try horizontal
                            let horizontalMatches = this.tryMatchHorizontal(word, row, col);
                            if (horizontalMatches.length === word.length) {
                                return horizontalMatches;
                            }

                            // Try vertical
                            let verticalMatches = this.tryMatchVertical(word, row, col);
                            if (verticalMatches.length === word.length) {
                                return verticalMatches;
                            }
                        }
                    }
                }

                return [];
            }

            tryMatchHorizontal(word, row, startCol) {
                const matches = [];
                for (let i = 0; i < word.length; i++) {
                    const col = startCol + i;
                    if (col >= BOARD_WIDTH || !this.board[row][col] || this.board[row][col].letter !== word[i]) {
                        return [];
                    }
                    matches.push({ row, col });
                }
                return matches;
            }

            tryMatchVertical(word, startRow, col) {
                const matches = [];
                for (let i = 0; i < word.length; i++) {
                    const row = startRow + i;
                    if (row >= BOARD_HEIGHT || !this.board[row][col] || this.board[row][col].letter !== word[i]) {
                        return [];
                    }
                    matches.push({ row, col });
                }
                return matches;
            }

            applyGravity() {
                for (let col = 0; col < BOARD_WIDTH; col++) {
                    let writePos = BOARD_HEIGHT - 1;
                    for (let row = BOARD_HEIGHT - 1; row >= 0; row--) {
                        if (this.board[row][col] !== null) {
                            this.board[writePos][col] = this.board[row][col];
                            if (writePos !== row) {
                                this.board[row][col] = null;
                            }
                            writePos--;
                        }
                    }
                }
            }

            showMessage(text, type) {
                const messageEl = document.getElementById('message');
                messageEl.textContent = text;
                messageEl.className = `message ${type}`;
                setTimeout(() => {
                    messageEl.textContent = '';
                    messageEl.className = 'message';
                }, 3000);
            }

            gameLoop() {
                if (!this.gameOver) {
                    const now = Date.now();
                    if (now - this.lastDropTime > this.gameSpeed) {
                        if (!this.collides(this.currentX, this.currentY + 1, this.currentPiece.shape)) {
                            this.currentY++;
                        } else {
                            this.lockPiece();
                        }
                        this.lastDropTime = now;
                        this.render();
                    }
                    requestAnimationFrame(() => this.gameLoop());
                }
            }

            endGame() {
                this.gameOver = true;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOverModal').classList.add('show');
                document.getElementById('overlay').classList.add('show');
            }

            render() {
                this.renderBoard();
                this.renderNextPiece();
                this.renderScore();
                this.renderWordHistory();
            }

            renderBoard() {
                const boardEl = document.getElementById('gameBoard');
                boardEl.innerHTML = '';

                // Create a copy of the board with the current piece
                const displayBoard = JSON.parse(JSON.stringify(this.board));

                // Add current piece to display
                for (let row = 0; row < this.currentPiece.shape.length; row++) {
                    for (let col = 0; col < this.currentPiece.shape[row].length; col++) {
                        if (this.currentPiece.shape[row][col] === 1) {
                            const boardY = this.currentY + row;
                            const boardX = this.currentX + col;
                            if (boardY >= 0 && boardY < BOARD_HEIGHT && boardX >= 0 && boardX < BOARD_WIDTH) {
                                displayBoard[boardY][boardX] = {
                                    letter: this.currentPiece.letters[row][col].letter,
                                    bonus: this.currentPiece.letters[row][col].bonus,
                                    color: this.currentPiece.color,
                                    isActive: true
                                };
                            }
                        }
                    }
                }

                // Render all cells
                for (let row = 0; row < BOARD_HEIGHT; row++) {
                    for (let col = 0; col < BOARD_WIDTH; col++) {
                        const cell = displayBoard[row][col];
                        const cellEl = document.createElement('div');
                        cellEl.className = 'cell';

                        if (cell) {
                            cellEl.classList.add('filled');
                            if (cell.bonus) {
                                cellEl.classList.add(`bonus-${cell.bonus}`);
                                const bonusLabel = document.createElement('div');
                                bonusLabel.className = 'bonus-label';
                                bonusLabel.textContent = cell.bonus.split('-')[0][0].toUpperCase();
                                cellEl.appendChild(bonusLabel);
                            }

                            const letterEl = document.createElement('div');
                            letterEl.className = 'cell-letter';
                            letterEl.textContent = cell.letter;

                            // Set text color based on background
                            if (cell.bonus) {
                                if (cell.bonus.includes('word')) {
                                    letterEl.style.color = '#fff';
                                } else {
                                    letterEl.style.color = '#000';
                                }
                            } else {
                                letterEl.style.color = '#fff';
                            }

                            cellEl.appendChild(letterEl);
                        }

                        boardEl.appendChild(cellEl);
                    }
                }
            }

            renderNextPiece() {
                const nextEl = document.getElementById('nextPiece');
                nextEl.innerHTML = '';

                for (let row = 0; row < 4; row++) {
                    for (let col = 0; col < 4; col++) {
                        const cellEl = document.createElement('div');
                        cellEl.className = 'cell';

                        if (row < this.nextPiece.shape.length && col < this.nextPiece.shape[row].length) {
                            if (this.nextPiece.shape[row][col] === 1) {
                                cellEl.classList.add('filled');
                                const letterEl = document.createElement('div');
                                letterEl.className = 'cell-letter';
                                letterEl.textContent = this.nextPiece.letters[row][col].letter;
                                cellEl.appendChild(letterEl);
                            }
                        }

                        nextEl.appendChild(cellEl);
                    }
                }
            }

            renderScore() {
                document.getElementById('score').textContent = this.score;
            }

            renderWordHistory() {
                const historyEl = document.getElementById('lastWords');
                historyEl.innerHTML = '';
                for (let item of this.wordHistory) {
                    const wordEl = document.createElement('div');
                    wordEl.className = 'word-item';
                    wordEl.textContent = `${item.word} +${item.score}`;
                    historyEl.appendChild(wordEl);
                }
            }
        }

        // Start the game
        const game = new Game();
