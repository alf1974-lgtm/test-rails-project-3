<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Tic&nbsp;Tac&nbsp;Toe</h1>

  <!-- Score board -->
  <div id="scoreboard">
    <div class="score-box x-box">
      <div class="label">Player 1 · X</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box draw-box">
      <div class="label">Draws</div>
      <div class="value" id="score-draw">0</div>
    </div>
    <div class="score-box o-box">
      <div class="label">Player 2 · O</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <!-- Status banner -->
  <div id="status"></div>

  <!-- Game board -->
  <div id="board" role="grid" aria-label="Tic Tac Toe board">
    <div class="cell" role="gridcell" aria-label="Cell 1"></div>
    <div class="cell" role="gridcell" aria-label="Cell 2"></div>
    <div class="cell" role="gridcell" aria-label="Cell 3"></div>
    <div class="cell" role="gridcell" aria-label="Cell 4"></div>
    <div class="cell" role="gridcell" aria-label="Cell 5"></div>
    <div class="cell" role="gridcell" aria-label="Cell 6"></div>
    <div class="cell" role="gridcell" aria-label="Cell 7"></div>
    <div class="cell" role="gridcell" aria-label="Cell 8"></div>
    <div class="cell" role="gridcell" aria-label="Cell 9"></div>
  </div>

  <!-- Controls -->
  <div class="btn-row">
    <button id="btn-restart">New Game</button>
    <button id="btn-reset-scores">Reset Scores</button>
  </div>

  <footer>Player 1 = X &nbsp;·&nbsp; Player 2 = O &nbsp;·&nbsp; Pass the mouse after each turn</footer>

  <script src="game.js"></script>
</body>
</html>
