<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="score-label">Player X</span>
        <span class="score-value" id="wins-x">0</span>
      </div>
      <div class="score-card draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="draws">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="score-label">Player O</span>
        <span class="score-value" id="wins-o">0</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="turn-indicator">
        <span id="current-marker" class="marker x">X</span>
        <span id="status-text">'s turn</span>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="overlay hidden" id="overlay">
      <div class="overlay-content">
        <div class="result-icon" id="result-icon"></div>
        <p class="result-text" id="result-text"></p>
        <button class="btn" id="play-again-btn">Play Again</button>
      </div>
    </div>

    <button class="btn btn-secondary" id="reset-btn">Reset Scores</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
