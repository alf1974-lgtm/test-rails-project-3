<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="score-label">Player 1 (X)</span>
        <span class="score-value" id="wins-x">0</span>
      </div>
      <div class="score-card draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="draws">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="score-label">Player 2 (O)</span>
        <span class="score-value" id="wins-o">0</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="player-indicator" id="player-indicator">
        <span class="marker" id="current-marker">X</span>
        <span id="status-text">Player 1's turn</span>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <!-- Overlay shown at end of each game -->
    <div class="overlay hidden" id="overlay">
      <div class="overlay-box">
        <div class="overlay-icon" id="overlay-icon"></div>
        <p class="overlay-message" id="overlay-message"></p>
        <button class="btn" id="next-round-btn">Play Again</button>
      </div>
    </div>

    <button class="btn btn-reset" id="reset-btn">Reset Scores</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
