<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Tic Tac Toe</h1>

  <!-- Current-turn / result banner -->
  <p id="status" class="x-turn">Player X's turn</p>

  <!-- Score board -->
  <div id="scoreboard">
    <div class="score-box x">
      <span class="score-label">Player X</span>
      <span class="score-value" id="score-x">0</span>
    </div>
    <div class="score-box draws">
      <span class="score-label">Draws</span>
      <span class="score-value" id="score-draws">0</span>
    </div>
    <div class="score-box o">
      <span class="score-label">Player O</span>
      <span class="score-value" id="score-o">0</span>
    </div>
  </div>

  <!-- 3×3 board -->
  <div id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <!-- Action buttons -->
  <div class="btn-row">
    <button id="btn-restart">New Round</button>
    <button id="btn-reset-scores">Reset Scores</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
