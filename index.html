<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>&#x1F9E9; Sudoku</h1>
      <div class="meta-row">
        <div class="difficulty-selector">
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="timer-display">
          <span id="timer">00:00</span>
        </div>
      </div>
    </header>

    <main>
      <div class="board-wrapper">
        <table id="sudoku-board" class="sudoku-board" aria-label="Sudoku grid"></table>
      </div>

      <div class="numpad" id="numpad" aria-label="Number pad">
        <button class="num-btn" data-value="1">1</button>
        <button class="num-btn" data-value="2">2</button>
        <button class="num-btn" data-value="3">3</button>
        <button class="num-btn" data-value="4">4</button>
        <button class="num-btn" data-value="5">5</button>
        <button class="num-btn" data-value="6">6</button>
        <button class="num-btn" data-value="7">7</button>
        <button class="num-btn" data-value="8">8</button>
        <button class="num-btn" data-value="9">9</button>
        <button class="num-btn erase-btn" data-value="0" title="Erase">&#x232B;</button>
      </div>

      <div class="controls">
        <button id="btn-new"    class="ctrl-btn primary">New Game</button>
        <button id="btn-hint"   class="ctrl-btn">Hint</button>
        <button id="btn-check"  class="ctrl-btn">Check</button>
        <button id="btn-solve"  class="ctrl-btn danger">Solve</button>
      </div>

      <div id="message-bar" class="message-bar hidden"></div>
    </main>
  </div>

  <!-- Win modal -->
  <div id="win-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h2 id="modal-title">Puzzle Solved!</h2>
      <p id="modal-time"></p>
      <button id="modal-new-btn" class="ctrl-btn primary">Play Again</button>
    </div>
  </div>

  <script src="js/sudoku.js"></script>
</body>
</html>
