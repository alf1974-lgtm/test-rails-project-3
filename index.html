<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="score-label">Player 1 (X)</span>
        <span class="score-value" id="wins-x">0</span>
      </div>
      <div class="score-card draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="draws">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="score-label">Player 2 (O)</span>
        <span class="score-value" id="wins-o">0</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="turn-indicator">
        <span class="turn-token" id="turn-token">X</span>
        <span id="status-text">Player 1's turn</span>
      </div>
    </div>

    <div class="board" id="board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <!-- Win overlay -->
    <div class="overlay hidden" id="overlay">
      <div class="overlay-box">
        <div class="overlay-icon" id="overlay-icon"></div>
        <p class="overlay-message" id="overlay-message"></p>
        <button class="btn-play-again" id="btn-play-again">Play Again</button>
      </div>
    </div>

    <button class="btn-reset" id="btn-reset">Reset Scores</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
